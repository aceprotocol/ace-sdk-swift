name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS 26 arm64 with Xcode 26.x (Swift 6.2+): CryptoKit ML-DSA and X-Wing.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test
